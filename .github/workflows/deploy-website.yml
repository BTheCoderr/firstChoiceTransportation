name: First Choice Website Deploy

# Publish only the exact commit that passed all First Choice CI checks.
# Netlify is a static export; a GitHub Actions site-scoped token is needed.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: firstchoice-netlify-production
  cancel-in-progress: true

jobs:
  website:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: a4216bd6-ad04-4ed8-ba99-8f676fefe1bc
    steps:
      - name: Require Netlify deployment authorization
        shell: bash
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ]; then
            echo "::error title=Netlify deployment BLOCKED::Add NETLIFY_AUTH_TOKEN to this repository's GitHub Actions secrets. This website was NOT published."
            exit 1
          fi

      - name: Checkout verified source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build static website
        run: |
          npm ci --prefix web
          npm run build --prefix web
          test -f web/out/auth/reset-password/index.html
          test -f web/out/support/index.html
          test -f web/out/privacy/index.html

      - name: Deploy verified static site to the existing Netlify project
        shell: bash
        run: |
          npx --yes netlify-cli deploy --prod --dir web/out --site "$NETLIFY_SITE_ID" --auth "$NETLIFY_AUTH_TOKEN" --json
          echo "### First Choice production website deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Published the verified static export from commit $(git rev-parse HEAD) to https://firstchoicetransportation.netlify.app" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify published support and recovery pages
        shell: bash
        run: |
          node scripts/qa-live-website.mjs
