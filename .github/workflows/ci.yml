name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Option B timing QA
        run: npm run qa:option-b-timing

      - name: Verify pinned navigation dependency
        run: npm run deps:verify

      - name: Release and security regression QA
        run: npm run qa:release

      - name: Live invitation authorization smoke
        run: node scripts/qa-live-invitation-endpoint.mjs

      - name: Administrator review, GPS and recovery QA
        run: npm run qa:admin-review

      - name: Expo Doctor (release compatibility)
        run: npx --yes expo-doctor

      - name: Website dependencies
        run: npm ci --prefix web

      - name: Website production build
        run: npm run build --prefix web
